name: recipe-app                          # project name shown in Docker Desktop

services:
  db:                                     # the PostgreSQL database container
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data # keeps the data when the container stops
    healthcheck:                        # ready once Postgres accepts connections
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 15


  db-test:
    image: postgres:16
    environment:
      POSTGRES_USER: recipes
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: recipes_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recipes -d recipes_test"]
      interval: 2s
      timeout: 5s
      retries: 15


  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 15


  api:                                    # our Flask app container
    build: .                              # builds image from Dockerfile
    command: flask run --host 0.0.0.0 --port 8000 --debug
    volumes:
      - .:/app                            # mount our code so edits are seen live
    env_file:
      - .env
    environment:
      FLASK_APP: main                     # so 'flask ...' commands find main.py
    ports:
      - "8000:8000"
    depends_on:                           # wait until healthy, not just started
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-test:
        condition: service_healthy


  worker:
    build: .
    command: celery -A tasks.celery_app worker --loglevel=info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy



volumes:
  dbdata:
